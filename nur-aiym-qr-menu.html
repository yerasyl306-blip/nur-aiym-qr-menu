<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>НҰР-АЙЫМ — QR мәзір</title>
<style>
:root{--green:#197348;--dark:#173426;--cream:#fff9ef;--line:#e8ded0;--red:#b83232}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1d2d24;font:16px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px}.top{background:var(--dark);color:white;padding:15px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center}.top b{font-size:20px}.top img{height:34px;width:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:9px}.wrap{max-width:1120px;margin:auto;padding:24px 18px 95px}.hero{padding:25px;border-radius:20px;color:#fff;background:linear-gradient(130deg,#2a784b,#173426);margin-bottom:20px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#deeddf}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filter{background:#fff;border:1px solid var(--line)}.filter.active,.primary{background:var(--green);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.photo{height:145px;background:#eee0c8;display:grid;place-items:center;font-size:52px}.photo img{width:100%;height:100%;object-fit:cover}.pad{padding:14px}.card h3{margin:0 0 7px}.muted{color:#6d766f;font-size:13px}.price{color:var(--green);font-size:18px;font-weight:bold}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.cart{position:fixed;right:16px;bottom:16px;background:var(--green);color:#fff;border-radius:25px;box-shadow:0 4px 16px #0004}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:5;padding:16px;align-items:center;justify-content:center}.modal.show{display:flex}.modal .panel{width:min(570px,100%);max-height:92vh;overflow:auto;padding:21px}label{display:grid;gap:5px;font-weight:bold}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;background:#fff}form{display:grid;gap:11px}.line{padding:11px 0;border-bottom:1px solid var(--line)}.qty button{padding:3px 9px;background:#e7f2eb;color:var(--green)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .panel{width:min(400px,100%);padding:24px}.admin{display:grid;grid-template-columns:190px 1fr;gap:16px}.side{padding:8px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent}.side button.active{background:#e6f2eb;color:var(--green)}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.scroll{overflow:auto}.qr{text-align:center}.qr img{width:180px;height:180px}.status{display:inline-block;padding:5px 9px;border-radius:14px;background:#e6f2eb;color:var(--green);font-size:12px}.kitchen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.order{border-left:6px solid #e7ad34}.order.new{border-left-color:#c94545}.order h3{margin:0}.danger{background:#fff0f0;color:var(--red)}.secondary{background:#e6f2eb;color:var(--green)}@media(max-width:700px){.admin{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap}.hero h1{font-size:25px}}
</style></head><body><div id="app"></div><div id="modal" class="modal"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app'), modal=$('#modal'); let db={},cart=[],filter='Барлығы',adminPanel='foods',token=sessionStorage.token||'',role=sessionStorage.role||'';
const money=n=>Number(n||0).toLocaleString('kk-KZ')+' ₸', esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(url,opt);let body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error||'Қате орын алды');return body}
function close(){modal.classList.remove('show');modal.innerHTML=''} function show(html){modal.innerHTML='<div class="panel">'+html+'</div>';modal.classList.add('show')}
function context(){let p=new URLSearchParams(location.search);return {type:p.get('type')||'table',table:p.get('table')||''}}
function header(text){return '<header class="top"><b>'+ (db.logo?'<img src="'+db.logo+'">':'')+'НҰР-АЙЫМ</b><span>'+text+'</span></header>'}
async function load(){db=await api('/api/public');route()}
function route(){if(location.pathname==='/admin')return login('admin');if(location.pathname==='/kitchen')return login('kitchen');menu()}
function menu(){let c=context(), title=c.type==='delivery'?'Жеткізу':c.type==='pickup'?'Самовывоз':c.table?'Үстел №'+esc(c.table):'QR мәзір';let foods=db.foods.filter(f=>!f.stopped&&(filter==='Барлығы'||f.category===filter));app.innerHTML=header(title)+'<main class="wrap"><section class="hero"><h1>Қош келдіңіз!</h1><p>Дәмді тағамды таңдаңыз, тапсырысыңыз асүйге бірден түседі.</p></section><div class="row"><h2>Мәзір</h2><span class="muted">'+foods.length+' тағам</span></div><div class="filters">'+['Барлығы',...db.categories].map(x=>'<button class="filter '+(filter===x?'active':'')+'" onclick="filter='+JSON.stringify(x)+';menu()">'+esc(x)+'</button>').join('')+'</div><div class="grid">'+foods.map(f=>'<article class="card"><div class="photo">'+(f.photo?'<img src="'+f.photo+'">':esc(f.emoji||'🍽️'))+'</div><div class="pad"><h3>'+esc(f.name)+'</h3><p class="muted">'+esc(f.desc)+'</p><div class="row"><span class="price">'+money(f.price)+'</span><button class="primary" onclick="add('+f.id+')">Қосу</button></div></div></article>').join('')+'</div></main><button class="cart '+(!cart.length?'hidden':'')+'" onclick="openCart()">Себет: '+cart.reduce((s,x)=>s+x.qty,0)+'</button>'}
function add(id){let f=db.foods.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id:f.id,name:f.name,price:f.price,qty:1});menu()}
function openCart(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);show('<div class="row"><h2>Себет</h2><button onclick="close()">×</button></div>'+cart.map(x=>'<div class="line row"><div><b>'+esc(x.name)+'</b><br><small>'+money(x.price)+'</small></div><div class="qty"><button onclick="qty('+x.id+',-1)">−</button> '+x.qty+' <button onclick="qty('+x.id+',1)">+</button></div></div>').join('')+'<div class="row" style="margin:18px 0"><b>Жалпы:</b><b>'+money(total)+'</b></div><button class="primary" style="width:100%" onclick="checkout()">Тапсырыс беру</button>')}
function qty(id,n){let x=cart.find(x=>x.id===id);x.qty+=n;if(x.qty<1)cart=cart.filter(x=>x.id!==id);openCart();menu()}
function checkout(){let c=context(),extra=c.type==='delivery'?'<label>Аты-жөніңіз<input id="customer" required></label><label>Телефон<input id="phone" required></label><label>Мекенжай<textarea id="address" required></textarea></label>':c.type==='pickup'?'<label>Аты-жөніңіз<input id="customer"></label><label>Телефон<input id="phone"></label>':'';show('<div class="row"><h2>Тапсырысты растау</h2><button onclick="close()">×</button></div><form onsubmit="sendOrder(event)">'+extra+'<button class="primary">Тапсырысты жіберу</button></form>')}
async function sendOrder(e){e.preventDefault();let c=context();try{await api('/api/orders',{method:'POST',body:JSON.stringify({type:c.type,table:c.table,items:cart,customer:$('#customer')?.value,phone:$('#phone')?.value,address:$('#address')?.value})});cart=[];close();alert('Тапсырысыңыз қабылданды. Рақмет!');menu()}catch(e){alert(e.message)}}
function login(target){if(role===target)return target==='admin'?admin():kitchen();app.innerHTML='<main class="login">'+header(target==='kitchen'?'Асүй панелі':'Әкімші панелі')+'<form class="panel"><h2>'+ (target==='kitchen'?'Асүйге кіру':'Әкімші кіруі')+'</h2><label>Логин<input id="login" autocomplete="username" required></label><label>Құпиясөз<input id="password" type="password" required></label><p id="err" class="muted"></p><button class="primary">Кіру</button></form></main>';document.querySelector('.login form').addEventListener('submit',e=>signIn(e,target))}
async function signIn(e,target){e.preventDefault();try{let r=await api('/api/login',{method:'POST',body:JSON.stringify({login:$('#login').value,password:$('#password').value})});if(r.role!==target)throw Error('Бұл панельге рұқсат жоқ.');token=r.token;role=r.role;sessionStorage.token=token;sessionStorage.role=role;target==='admin'?admin():kitchen()}catch(e){$('#err').textContent=e.message}}
async function admin(){try{db=await api('/api/data');renderAdmin()}catch{role='';sessionStorage.clear();login('admin')}}
function renderAdmin(){app.innerHTML=header('Әкімші панелі')+'<main class="wrap admin"><nav class="panel side">'+[['foods','Тағамдар'],['tables','QR кодтар'],['orders','Тапсырыстар']].map(x=>'<button class="'+(adminPanel===x[0]?'active':'')+'" onclick="adminPanel='+JSON.stringify(x[0])+';renderAdmin()">'+x[1]+'</button>').join('')+'<button onclick="logout()">Шығу</button></nav><section class="panel pad" id="panel"></section></main>';let p=$('#panel');if(adminPanel==='foods')return foodsAdmin(p);if(adminPanel==='tables')return tablesAdmin(p);ordersAdmin(p)}
function foodsAdmin(p){p.innerHTML='<div class="row"><h2>Тағамдар</h2><button class="primary" onclick="foodForm()">+ Тағам қосу</button></div><div class="scroll"><table><tr><th>Тағам</th><th>Сурет</th><th>Баға</th><th></th></tr>'+db.foods.map(f=>'<tr><td>'+esc(f.name)+'</td><td>'+(f.photo?'✓':'—')+'</td><td>'+money(f.price)+'</td><td><button class="secondary" onclick="foodForm('+f.id+')">Өзгерту</button> <button class="danger" onclick="removeFood('+f.id+')">Өшіру</button></td></tr>').join('')+'</table></div>'}
function foodForm(id){let f=db.foods.find(x=>x.id===id)||{};show('<div class="row"><h2>'+ (id?'Тағамды өзгерту':'Тағам қосу')+'</h2><button onclick="close()">×</button></div><form onsubmit="saveFood(event,'+(id||0)+')"><label>Атауы<input id="name" value="'+esc(f.name)+'" required></label><label>Санат<select id="category">'+db.categories.map(x=>'<option '+(x===f.category?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><label>Бағасы<input id="price" type="number" value="'+(f.price||'')+'" required></label><label>Сурет (галерея)<input id="photo" type="file" accept="image/*"></label><label>Белгіше<input id="emoji" value="'+esc(f.emoji||'')+'"></label><label>Сипаттама<textarea id="desc">'+esc(f.desc||'')+'</textarea></label><button class="primary">Сақтау</button></form>')}
function fileData(input){return new Promise(r=>{let f=input.files[0];if(!f)return r('');let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
async function saveFood(e,id){e.preventDefault();let old=db.foods.find(x=>x.id===id)||{},photo=await fileData($('#photo'));let f={...old,id:id||Date.now(),name:$('#name').value,category:$('#category').value,price:Number($('#price').value),emoji:$('#emoji').value,desc:$('#desc').value,photo:photo||old.photo||'',stopped:old.stopped||false};id?db.foods=db.foods.map(x=>x.id===id?f:x):db.foods.push(f);await saveDb();close();renderAdmin()}
async function removeFood(id){if(confirm('Тағамды өшіру керек пе?')){db.foods=db.foods.filter(x=>x.id!==id);await saveDb();renderAdmin()}}
function qr(url){return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&ecc=M&data='+encodeURIComponent(url)}
function tablesAdmin(p){let base=location.origin,cards=[...db.tables.map(t=>['Үстел №'+t,base+'/?type=table&table='+encodeURIComponent(t)]),['Самовывоз',base+'/?type=pickup'],['Жеткізу',base+'/?type=delivery']];p.innerHTML='<div class="row"><h2>Дайын QR кодтар</h2><button class="primary" onclick="addTable()">+ Үстел</button></div><p class="muted">QR кодты телефонмен сканерлеп, жүктеп не басып шығаруға болады.</p><div class="grid">'+cards.map(x=>'<div class="card qr"><div class="pad"><h3>'+x[0]+'</h3><img src="'+qr(x[1])+'"><p class="muted">'+x[1]+'</p></div></div>').join('')+'</div>'}
async function addTable(){let n=prompt('Үстел нөмірі');if(n&&!db.tables.includes(n)){db.tables.push(n);await saveDb();renderAdmin()}}
function ordersAdmin(p){p.innerHTML='<h2>Тапсырыстар</h2><div class="scroll"><table><tr><th>Уақыт</th><th>Түрі</th><th>Тапсырыс</th><th>Сома</th><th>Күйі</th></tr>'+db.orders.map(o=>'<tr><td>'+esc(o.date)+'</td><td>'+esc(o.type==='table'?'Үстел '+o.table:o.type==='delivery'?'Жеткізу':'Самовывоз')+'</td><td>'+o.items.map(x=>esc(x.name)+' ×'+x.qty).join('<br>')+'</td><td>'+money(o.total)+'</td><td>'+esc(o.status)+'</td></tr>').join('')+'</table></div>'}
async function saveDb(){await api('/api/data',{method:'POST',body:JSON.stringify(db)})}function logout(){sessionStorage.clear();token='';role='';route()}
async function kitchen(){try{let r=await api('/api/orders');db.orders=r.orders;renderKitchen();listen()}catch{role='';sessionStorage.clear();login('kitchen')}}
function renderKitchen(){app.innerHTML=header('Асүй панелі')+'<main class="wrap"><div class="row"><div><h2>Асүй тапсырыстары</h2><span class="muted">Жаңа тапсырыс түскенде дыбыс шығады</span></div><button class="secondary" onclick="logout()">Шығу</button></div><div class="kitchen-grid">'+db.orders.filter(o=>o.status!=='Жабылды').map(o=>'<article class="panel pad order '+(o.status==='Жаңа'?'new':'')+'"><div class="row"><h3>#'+o.number+'</h3><span class="status">'+esc(o.status)+'</span></div><p><b>'+esc(o.type==='table'?'Үстел №'+o.table:o.type==='delivery'?'Жеткізу':'Самовывоз')+'</b><br><small>'+esc(o.date)+'</small></p>'+o.items.map(i=>'<div class="line">'+esc(i.name)+' × '+i.qty+'</div>').join('')+'<p><b>'+money(o.total)+'</b></p><select onchange="status('+o.id+',this.value)">'+['Жаңа','Дайындалуда','Дайын','Жабылды'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></article>').join('')+'</div></main>'}
async function status(id,value){await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status:value})});let x=db.orders.find(x=>x.id===id);x.status=value;renderKitchen()}
let events;function listen(){if(events)return;events=new EventSource('/api/events?token='+encodeURIComponent(token));events.addEventListener('new-order',e=>{db.orders.unshift(JSON.parse(e.data));beep();renderKitchen()});events.addEventListener('order-updated',e=>{let o=JSON.parse(e.data),i=db.orders.findIndex(x=>x.id===o.id);if(i>=0)db.orders[i]=o;renderKitchen()})}function beep(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.13,c.currentTime);o.start();o.stop(c.currentTime+.25)}catch{}}
load().catch(()=>app.innerHTML='<main class="login"><div class="panel"><h2>Қосылым қатесі</h2><p>Бетті қайта жүктеп көріңіз.</p></div></main>');
</script></body></html>
