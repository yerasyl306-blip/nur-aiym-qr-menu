<!doctype html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>НҰР-АЙЫМ — QR мәзір</title>
  <style>
    :root{--ink:#1e2b22;--green:#1e7a48;--cream:#fff9ee;--line:#e7dfd0;--muted:#6c766e;--red:#c94545}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}button,input,select,textarea{font:inherit}.top{background:var(--ink);color:#fff;padding:16px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:3}.brand{font-size:20px;font-weight:800;letter-spacing:1px}.brand-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:9px;background:#fff}.badge{font-size:13px;background:#ffffff20;border-radius:20px;padding:7px 11px}main{max-width:1120px;margin:auto;padding:24px 20px 90px}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(120deg,#27633f,#1e2b22);color:#fff;border-radius:22px;padding:27px;margin-bottom:24px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:#d9ebdd}.tab,button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#e9f3ec;color:var(--green);font-weight:700}.danger{background:#fff0f0;color:var(--red);font-weight:700}.menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.menu-head h2{margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{background:#fff;border:1px solid var(--line);color:var(--muted)}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.foodpic{height:115px;background:linear-gradient(135deg,#e6b36d,#834724);display:grid;place-items:center;font-size:48px}.foodpic img{width:100%;height:100%;object-fit:cover}.card-body{padding:15px}.card h3{margin:0 0 7px;font-size:18px}.desc{color:var(--muted);font-size:13px;min-height:32px;margin:0 0 13px}.price-row{display:flex;justify-content:space-between;align-items:center;font-weight:bold}.price{color:var(--green);font-size:17px}.cart{position:fixed;right:17px;bottom:17px;background:var(--green);color:#fff;border-radius:30px;box-shadow:0 7px 22px #17482955;font-weight:bold;padding:14px 18px;z-index:4}.modal{display:none;position:fixed;inset:0;background:#17251bb3;z-index:5;padding:18px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-box{background:var(--cream);width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:19px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.close{background:none;font-size:26px;padding:0}.cart-item{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:3px 9px;background:#e9f3ec;color:var(--green)}.total{font-size:19px;font-weight:bold;display:flex;justify-content:space-between;margin:17px 0}form{display:grid;gap:11px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.empty{text-align:center;color:var(--muted);padding:35px}.admin-grid{display:grid;grid-template-columns:210px 1fr;gap:20px}.side{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;height:max-content}.side button{width:100%;text-align:left;background:transparent;color:var(--ink)}.side button.active{background:#e9f3ec;color:var(--green)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.panel h2{margin-top:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f4f8f4;border-radius:12px;padding:15px}.stat b{display:block;font-size:25px;color:var(--green);margin-top:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.status{font-size:12px;border-radius:20px;padding:5px 8px;background:#e9f3ec;color:var(--green);white-space:nowrap}.stop{background:#fff0f0;color:var(--red)}.row-actions{display:flex;gap:5px}.row-actions button{padding:6px 8px;font-size:12px}.notice{padding:12px;background:#e9f3ec;border-radius:10px;color:var(--green);margin:0 0 15px}.hidden{display:none!important}.qr-card{text-align:center}.qr-wrap{position:relative;display:inline-grid;place-items:center;background:#fff;padding:12px;border-radius:14px}.qr-img{width:190px;height:190px}.qr-logo{position:absolute;width:58px;height:58px;object-fit:cover;border-radius:50%;border:5px solid #fff;background:#fff}.logo-preview{width:90px;height:90px;object-fit:cover;border-radius:50%;background:#eee}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:7px}.side button{white-space:nowrap}.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}.top{position:static}}
  </style>
</head>
<body>
<header class="top"><div class="brand"><img id="headerLogo" class="brand-logo hidden" alt="Логотип">НҰР-АЙЫМ</div><div id="tableBadge" class="badge">QR мәзір</div></header>
<main>
  <section id="customer" class="view active"><div class="hero"><h1>Қош келдіңіз!</h1><p>Дәмді тағамды таңдаңыз, тапсырысыңыз асүйге бірден түседі.</p></div><div class="menu-head"><h2>Мәзір</h2><span id="availableCount" class="badge" style="background:#e9f3ec;color:#1e7a48"></span></div><div id="filters" class="filters"></div><div id="menuGrid" class="grid"></div></section>
  <section id="admin" class="view"><div class="admin-grid"><nav class="side"><button class="active" data-panel="dashboard">Шолу</button><button data-panel="foods">Тағамдар</button><button data-panel="tables">Үстелдер</button><button data-panel="orders">Тапсырыстар</button><button data-panel="reports">Есептер</button><button onclick="showView('customer')">← Клиент мәзірі</button></nav><div id="adminPanel" class="panel"></div></div></section>
</main>
<button id="cartButton" class="cart" onclick="openCart()">Себет: 0</button>
<div id="cartModal" class="modal"><div class="modal-box"><div class="modal-head"><h2>Сіздің тапсырысыңыз</h2><button class="close" onclick="closeModal('cartModal')">×</button></div><div id="cartItems"></div><div class="total"><span>Жалпы:</span><span id="cartTotal">0 ₸</span></div><button class="primary" style="width:100%" onclick="placeOrder()">Тапсырыс беру</button></div></div>
<div id="loginModal" class="modal"><div class="modal-box"><div class="modal-head"><h2>Әкімші кіруі</h2><button class="close" onclick="closeModal('loginModal')">×</button></div><form onsubmit="adminLogin(event)"><input id="loginUser" required autocomplete="username" placeholder="Логин"/><input id="loginPass" required type="password" autocomplete="current-password" placeholder="Құпиясөз"/><p id="loginError" class="hidden" style="color:#c94545;margin:0">Логин немесе құпиясөз қате.</p><button class="primary">Кіру</button></form></div></div>
<div id="foodModal" class="modal"><div class="modal-box"><div class="modal-head"><h2 id="foodModalTitle">Тағам қосу</h2><button class="close" onclick="closeModal('foodModal')">×</button></div><form onsubmit="saveFood(event)"><input id="foodId" type="hidden"/><input id="foodName" required placeholder="Тағам атауы"/><select id="foodCat"></select><input id="foodPrice" required type="number" min="0" placeholder="Бағасы, ₸"/><input id="foodPhoto" type="file" accept="image/*"/><input id="foodEmoji" placeholder="Белгіше, мысалы 🍲"/><textarea id="foodDesc" placeholder="Сипаттама"></textarea><button class="primary">Сақтау</button></form></div></div>
<script>
const defaults={foods:[{id:1,name:'Палау',category:'Ыстық тағамдар',price:1800,emoji:'🍛',desc:'Хош иісті күріш, ет және сәбіз'},{id:2,name:'Қуырдақ',category:'Ыстық тағамдар',price:2200,emoji:'🥘',desc:'Үйдің дәстүрлі қуырдағы'},{id:3,name:'Цезарь салаты',category:'Салаттар',price:1600,emoji:'🥗',desc:'Тауық еті мен жаңа көкөністер'},{id:4,name:'Лағман',category:'Ыстық тағамдар',price:1900,emoji:'🍜',desc:'Қол кеспе, ет және көкөністер'},{id:5,name:'Баурсақ',category:'Нан өнімдері',price:600,emoji:'🥯',desc:'Жаңа піскен бауырсақ'},{id:6,name:'Шай',category:'Сусындар',price:400,emoji:'🍵',desc:'Қара немесе көк шай'}],tables:[1,2,3,4,5,6,7,8],orders:[],categories:['Ыстық тағамдар','Салаттар','Нан өнімдері','Сусындар']};
let db=window.__SERVER_DB__||JSON.parse(localStorage.getItem('nurAiymDB'))||defaults,cart=[],activeCategory='Барлығы',activePanel='dashboard';
function save(){localStorage.setItem('nurAiymDB',JSON.stringify(db));if(location.protocol.startsWith('http'))fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)}).catch(()=>{})}function money(n){return Number(n).toLocaleString('kk-KZ')+' ₸'}function imageData(input,done){let f=input.files&&input.files[0];if(!f)return done('');let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}function renderLogo(){let l=document.getElementById('headerLogo');if(db.logo){l.src=db.logo;l.classList.remove('hidden')}else l.classList.add('hidden')}
function tableFromUrl(){return new URLSearchParams(location.search).get('table')}function renderMenu(){let foods=db.foods.filter(f=>!f.stopped&&(activeCategory==='Барлығы'||f.category===activeCategory));document.getElementById('availableCount').textContent=foods.length+' тағам қолжетімді';document.getElementById('filters').innerHTML=['Барлығы',...db.categories].map(c=>`<button class="filter ${c===activeCategory?'active':''}" onclick="activeCategory='${c}';renderMenu()">${c}</button>`).join('');document.getElementById('menuGrid').innerHTML=foods.length?foods.map(f=>`<article class="card"><div class="foodpic">${f.photo?`<img src="${f.photo}" alt="${f.name}">`:(f.emoji||'🍽️')}</div><div class="card-body"><h3>${f.name}</h3><p class="desc">${f.desc||''}</p><div class="price-row"><span class="price">${money(f.price)}</span><button class="primary" onclick="addCart(${f.id})">Қосу</button></div></div></article>`).join(''):'<div class="empty">Қазір қолжетімді тағам жоқ.</div>'}
function addCart(id){let f=db.foods.find(x=>x.id===id),i=cart.find(x=>x.id===id);i?i.qty++:cart.push({...f,qty:1});renderCartButton()}function renderCartButton(){let n=cart.reduce((s,x)=>s+x.qty,0);document.getElementById('cartButton').textContent='Себет: '+n;document.getElementById('cartButton').classList.toggle('hidden',!n)}function openCart(){renderCart();document.getElementById('cartModal').classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function renderCart(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById('cartItems').innerHTML=cart.map(x=>`<div class="cart-item"><div><b>${x.name}</b><br><small>${money(x.price)}</small></div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button>${x.qty}<button onclick="changeQty(${x.id},1)">+</button></div></div>`).join('')||'<p class="empty">Себет бос</p>';document.getElementById('cartTotal').textContent=money(total)}function changeQty(id,n){let x=cart.find(x=>x.id===id);x.qty+=n;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart();renderCartButton()}
function placeOrder(){if(!cart.length)return;let order={id:Date.now(),table:tableFromUrl()||'Үстел нөмірі көрсетілмеген',items:cart,total:cart.reduce((s,x)=>s+x.price*x.qty,0),status:'Жаңа',date:new Date().toLocaleString('kk-KZ')};db.orders.unshift(order);save();cart=[];renderCartButton();closeModal('cartModal');alert('Тапсырысыңыз қабылданды! Рақмет.')} 
function requestAdmin(){if(sessionStorage.getItem('nurAiymAdmin')==='yes')showView('admin');else document.getElementById('loginModal').classList.add('open')}function adminLogin(e){e.preventDefault();let user=document.getElementById('loginUser'),pass=document.getElementById('loginPass'),error=document.getElementById('loginError');if(user.value==='1111'&&pass.value==='3333'){sessionStorage.setItem('nurAiymAdmin','yes');closeModal('loginModal');pass.value='';error.classList.add('hidden');showView('admin')}else{error.classList.remove('hidden')}}function showView(id){if(id==='admin'&&sessionStorage.getItem('nurAiymAdmin')!=='yes'){requestAdmin();return}document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('cartButton').classList.toggle('hidden',id==='admin'||!cart.length);if(id==='admin')renderAdmin()}
function renderAdmin(){document.querySelectorAll('.side [data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===activePanel));let p=document.getElementById('adminPanel');if(activePanel==='dashboard'){let today=db.orders.reduce((s,o)=>s+o.total,0);p.innerHTML=`<h2>Басқару панелі</h2><p class="notice">Мәзірдегі өзгерістер клиенттерге бірден көрінеді.</p><div class="stats"><div class="stat">Тапсырыстар<b>${db.orders.length}</b></div><div class="stat">Түсім<b>${money(today)}</b></div><div class="stat">Қолжетімді тағам<b>${db.foods.filter(f=>!f.stopped).length}</b></div></div>`}else if(activePanel==='foods')renderFoods(p);else if(activePanel==='tables')renderTables(p);else if(activePanel==='orders')renderOrders(p);else renderReports(p)}
function renderFoods(p){p.innerHTML=`<div class="toolbar"><h2>Тағамдар</h2><button class="primary" onclick="openFood()">+ Тағам қосу</button></div><div class="table-wrap"><table><tr><th>Тағам</th><th>Санат</th><th>Баға</th><th>Күйі</th><th></th></tr>${db.foods.map(f=>`<tr><td>${f.emoji||'🍽️'} ${f.name}</td><td>${f.category}</td><td>${money(f.price)}</td><td><span class="status ${f.stopped?'stop':''}">${f.stopped?'Стоп':'Қолжетімді'}</span></td><td><div class="row-actions"><button class="secondary" onclick="toggleStop(${f.id})">${f.stopped?'Ашу':'Стоп'}</button><button class="secondary" onclick="openFood(${f.id})">Өзгерту</button><button class="danger" onclick="deleteFood(${f.id})">Өшіру</button></div></td></tr>`).join('')}</table></div>`}
function renderTables(p){p.innerHTML=`<div class="toolbar"><h2>Үстелдер</h2><button class="primary" onclick="addTable()">+ Үстел қосу</button></div><p class="notice">QR сілтеме үлгісі: осы беттің адресіне <b>?table=1</b> қосыңыз.</p><div class="grid">${db.tables.map(t=>`<div class="card"><div class="card-body"><h3>Үстел №${t}</h3><p class="desc">QR: ?table=${t}</p><button class="danger" onclick="removeTable(${t})">Өшіру</button></div></div>`).join('')}</div>`}
function renderOrders(p){p.innerHTML=`<div class="toolbar"><h2>Тапсырыстар</h2><span>${db.orders.length} барлығы</span></div><div class="table-wrap"><table><tr><th>Уақыт</th><th>Үстел</th><th>Тапсырыс</th><th>Сома</th><th>Күйі</th></tr>${db.orders.map(o=>`<tr><td>${o.date}</td><td><b>${o.table}</b></td><td>${o.items.map(x=>x.name+' ×'+x.qty).join(', ')}</td><td><b>${money(o.total)}</b></td><td><select onchange="changeStatus(${o.id},this.value)">${['Жаңа','Дайындалуда','Дайын','Жабылды'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Әзірге тапсырыс жоқ</td></tr>'}</table></div>`}
function renderReports(p){let total=db.orders.reduce((s,o)=>s+o.total,0),done=db.orders.filter(o=>o.status==='Жабылды').length;let popular={};db.orders.forEach(o=>o.items.forEach(i=>popular[i.name]=(popular[i.name]||0)+i.qty));let top=Object.entries(popular).sort((a,b)=>b[1]-a[1])[0];p.innerHTML=`<h2>Есептер</h2><div class="stats"><div class="stat">Жалпы түсім<b>${money(total)}</b></div><div class="stat">Жабылған тапсырыс<b>${done}</b></div><div class="stat">Танымал тағам<b>${top?top[0]:'—'}</b></div></div>`}
function openFood(id){let f=db.foods.find(x=>x.id===id)||{};foodModalTitle.textContent=id?'Тағамды өзгерту':'Тағам қосу';foodId.value=f.id||'';foodName.value=f.name||'';foodPrice.value=f.price||'';foodEmoji.value=f.emoji||'';foodDesc.value=f.desc||'';foodCat.innerHTML=db.categories.map(c=>`<option ${c===f.category?'selected':''}>${c}</option>`).join('');document.getElementById('foodModal').classList.add('open')}function saveFood(e){e.preventDefault();let id=Number(foodId.value),old=db.foods.find(x=>x.id===id)||{},base={id:id||Date.now(),name:foodName.value,category:foodCat.value,price:Number(foodPrice.value),emoji:foodEmoji.value,desc:foodDesc.value,stopped:old.stopped||false,photo:old.photo||''};imageData(document.getElementById('foodPhoto'),photo=>{if(photo)base.photo=photo;id?db.foods=db.foods.map(x=>x.id===id?base:x):db.foods.push(base);save();closeModal('foodModal');renderAdmin();renderMenu()})}function setLogo(input){imageData(input,photo=>{if(photo){db.logo=photo;save();renderLogo();renderAdmin()}})}function renderAdmin(){document.querySelectorAll('.side [data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===activePanel));let p=document.getElementById('adminPanel');if(activePanel==='dashboard'){let total=db.orders.reduce((s,o)=>s+o.total,0);p.innerHTML=`<div class="toolbar"><h2>Басқару панелі</h2><label class="secondary">Логотип жүктеу<input id="logoInput" type="file" accept="image/*" class="hidden" onchange="setLogo(this)"></label></div>${db.logo?`<img class="logo-preview" src="${db.logo}">`:''}<p class="notice">Логотип клиент мәзірі мен QR кодтардың ортасына шығады.</p><div class="stats"><div class="stat">Тапсырыстар<b>${db.orders.length}</b></div><div class="stat">Түсім<b>${money(total)}</b></div><div class="stat">Тағамдар<b>${db.foods.filter(f=>!f.stopped).length}</b></div></div>`}else if(activePanel==='foods')renderFoods(p);else if(activePanel==='tables')renderTables(p);else if(activePanel==='orders')renderOrders(p);else renderReports(p)}function renderTables(p){let base=location.origin;p.innerHTML=`<div class="toolbar"><h2>Үстелдер және QR кодтар</h2><button class="primary" onclick="addTable()">+ Үстел қосу</button></div><p class="notice">Үстел қосылғанда QR коды автоматты жасалады.</p><div class="grid">${db.tables.map(t=>{let url=base+'/?table='+encodeURIComponent(t);return `<div class="card qr-card"><div class="card-body"><h3>Үстел №${t}</h3><div class="qr-wrap"><img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&ecc=M&data=${encodeURIComponent(url)}">${db.logo?`<img class="qr-logo" src="${db.logo}">`:''}</div><p class="desc">${url}</p><button class="danger" onclick="removeTable(${JSON.stringify(t)})">Өшіру</button></div></div>`}).join('')}</div>`}function toggleStop(id){let f=db.foods.find(x=>x.id===id);f.stopped=!f.stopped;save();renderAdmin();renderMenu()}function deleteFood(id){if(confirm('Тағамды өшіру керек пе?')){db.foods=db.foods.filter(x=>x.id!==id);save();renderAdmin();renderMenu()}}function addTable(){let x=prompt('Үстел нөмірі');if(x&&!db.tables.includes(x)){db.tables.push(x);save();renderAdmin()}}function removeTable(x){db.tables=db.tables.filter(t=>t!==x);save();renderAdmin()}function changeStatus(id,s){db.orders.find(o=>o.id===id).status=s;save()}document.querySelectorAll('.side [data-panel]').forEach(b=>b.onclick=()=>{activePanel=b.dataset.panel;renderAdmin()});let t=tableFromUrl();if(t)document.getElementById('tableBadge').textContent='Үстел №'+t;renderLogo();if(location.pathname==='/admin'){requestAdmin()}renderMenu();renderCartButton();setInterval(()=>{if(location.protocol.startsWith('http')&&document.getElementById('admin').classList.contains('active'))fetch('/api/data').then(r=>r.json()).then(data=>{db=data;renderLogo();renderAdmin()}).catch(()=>{})},4000);
</script></body></html>
